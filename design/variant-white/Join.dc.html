<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Space+Grotesk:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap">
  <style>
    body { margin: 0; background: #F6F6F4; }
    a { color: #4B3BFF; }
    a:hover { color: #2E1FD6; }
    .push { transition: transform 110ms cubic-bezier(0.3, 1.4, 0.5, 1), box-shadow 110ms ease; }
    .push:active { transform: translateY(6px); box-shadow: 0 0 0 #2E1FD6; }
    .cell { transition: transform 160ms cubic-bezier(0.3, 1.5, 0.5, 1); }
    .caret { animation: blink 1.05s step-end infinite; }
    @keyframes blink {
      0% { opacity: 1; }
      50% { opacity: 0; }
      100% { opacity: 1; }
    }
    .confetti { position: absolute; top: -20px; border-radius: 2px; animation: fall 1900ms cubic-bezier(0.25, 0.6, 0.4, 1) forwards; }
    @keyframes fall {
      0% { transform: translateY(0) rotate(0deg); opacity: 1; }
      100% { transform: translateY(880px) rotate(720deg); opacity: 0; }
    }
    .springin { animation: springin 520ms cubic-bezier(0.2, 1.5, 0.4, 1) both; }
    @keyframes springin {
      0% { transform: scale(0.82) translateY(14px); opacity: 0; }
      100% { transform: scale(1) translateY(0); opacity: 1; }
    }
    .wobble { animation: wobble 5s ease-in-out infinite; }
    @keyframes wobble {
      0% { transform: rotate(-7deg); }
      50% { transform: rotate(-3deg); }
      100% { transform: rotate(-7deg); }
    }
  </style>
</helmet>

<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #FFFFFF; font-family: 'Space Grotesk', system-ui, sans-serif; color: #0B0B0C; display: flex; flex-direction: column;">

  <div style="position: absolute; right: -110px; top: -80px; width: 280px; height: 280px; border-radius: 50%; background: #4B3BFF; opacity: 0.07; pointer-events: none;"></div>
  <div style="position: absolute; left: -70px; bottom: 120px; width: 210px; height: 210px; border-radius: 50%; background: #00C97A; opacity: 0.07; pointer-events: none;"></div>

  <sc-for list="{{ bits }}" as="b" hint-placeholder-count="18">
    <span class="confetti" style="left: {{ b.left }}; width: {{ b.w }}; height: {{ b.h }}; background: {{ b.color }}; animation-delay: {{ b.delay }};"></span>
  </sc-for>

  <div style="position: relative; padding: 58px 24px 0;">
    <div style="display: flex; align-items: center; gap: 9px; margin-bottom: 16px;">
      <div style="display: flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: 10px; background: #0B0B0C;">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="10" r="3"></circle>
          <path d="M12 21s7-5.5 7-11a7 7 0 1 0-14 0c0 5.5 7 11 7 11Z"></path>
        </svg>
      </div>
      <span style="font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.16em; color: #A0A0A8;">R-LAND HUNT</span>
    </div>
    <div style="font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-weight: 800; font-size: 46px; line-height: 0.98; letter-spacing: -0.045em; color: #0B0B0C;">Got a<br>code?</div>
    <div style="font-size: 15px; line-height: 1.5; color: #6B6B72; margin-top: 12px;">Six characters from your captain. No account, no email, no forms.</div>
  </div>

  <div style="position: relative; display: flex; gap: 7px; padding: 30px 24px 0;">
    <sc-for list="{{ cells }}" as="c" hint-placeholder-count="6">
      <div class="cell" style="flex-grow: 1; height: 66px; display: flex; align-items: center; justify-content: center; border-radius: 16px; background: {{ c.bg }}; border: 2px solid {{ c.edge }}; transform: {{ c.pop }};">
        <sc-if value="{{ c.hasChar }}" hint-placeholder-val="{{ true }}">
          <span style="font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-weight: 800; font-size: 26px; letter-spacing: -0.02em; color: {{ c.ink }};">{{ c.ch }}</span>
        </sc-if>
        <sc-if value="{{ c.isCaret }}" hint-placeholder-val="{{ false }}">
          <span class="caret" style="width: 3px; height: 26px; border-radius: 2px; background: #4B3BFF;"></span>
        </sc-if>
      </div>
    </sc-for>
  </div>

  <sc-if value="{{ joined }}" hint-placeholder-val="{{ false }}">
    <div class="springin" style="position: relative; margin: 26px 24px 0; padding: 20px 20px 22px; border-radius: 24px; background: #F1FBF6; border: 1.5px solid #C4EFDB;">
      <div style="display: flex; align-items: center; gap: 9px; margin-bottom: 15px;">
        <div style="display: flex; align-items: center; justify-content: center; width: 22px; height: 22px; border-radius: 50%; background: #00C97A;">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="#FFFFFF" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M5 13l5 5L19 7"></path>
          </svg>
        </div>
        <span style="font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-weight: 800; font-size: 19px; letter-spacing: -0.02em; color: #00885A;">You&rsquo;re in!</span>
      </div>
      <div style="font-family: 'Space Mono', monospace; font-size: 10px; letter-spacing: 0.14em; color: #6B6B72; margin-bottom: 11px;">THE SALTED CREW</div>
      <div style="display: flex; align-items: center;">
        <div style="display: flex;">
          <span style="width: 38px; height: 38px; border-radius: 50%; background: #4B3BFF; border: 2.5px solid #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; color: #FFFFFF;">I</span>
          <span style="width: 38px; height: 38px; border-radius: 50%; background: #FF4B3B; border: 2.5px solid #FFFFFF; margin-left: -10px; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; color: #FFFFFF;">D</span>
          <span style="width: 38px; height: 38px; border-radius: 50%; background: #FFC400; border: 2.5px solid #FFFFFF; margin-left: -10px; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; color: #0B0B0C;">M</span>
          <span style="width: 38px; height: 38px; border-radius: 50%; background: #F0F0EE; border: 2.5px dashed #C8C8CE; margin-left: -10px; display: flex; align-items: center; justify-content: center; font-size: 17px; color: #A0A0A8;">+</span>
        </div>
        <span style="margin-left: 12px; font-size: 13px; color: #6B6B72;">1 spot left</span>
      </div>
    </div>
  </sc-if>

  <sc-if value="{{ waiting }}" hint-placeholder-val="{{ true }}">
    <div class="wobble" style="position: relative; align-self: flex-start; margin: 34px 0 0 24px; padding: 9px 15px 10px; border-radius: 999px; background: #FFF9E0; border: 1.5px solid #FFE9A8;">
      <span style="font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.1em; color: #9A7400;">12 CREWS ALREADY IN</span>
    </div>
  </sc-if>

  <div style="position: relative; flex-grow: 1;"></div>

  <div style="position: relative; display: flex; flex-direction: column; gap: 14px; padding: 0 24px 30px;">
    <div class="push" onClick="{{ join }}" style="display: flex; align-items: center; justify-content: center; gap: 11px; min-height: 68px; border-radius: 999px; background: {{ btnBg }}; box-shadow: 0 6px 0 {{ btnShadow }}, 0 16px 30px {{ btnGlow }}; cursor: pointer;">
      <span style="font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-weight: 800; font-size: 22px; letter-spacing: -0.02em; color: #FFFFFF;">{{ btnLabel }}</span>
      <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="#FFFFFF" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M5 12h13"></path>
        <path d="M12 6l6 6-6 6"></path>
      </svg>
    </div>
    <div style="text-align: center; font-size: 13px; color: #A0A0A8;">Starting a crew instead? <span style="color: #4B3BFF; font-weight: 500;">Make a code</span></div>
  </div>

</div>
</x-dc>

<script data-dc-script data-props='{"sound":{"editor":"boolean","default":true,"section":"Feel"},"$preview":{"width":390,"height":844}}'>
var SND = {
  ctx: null,
  ac: function () {
    if (!this.ctx) {
      var C = window.AudioContext || window.webkitAudioContext;
      if (!C) { return null; }
      this.ctx = new C();
    }
    if (this.ctx.state === 'suspended') { this.ctx.resume(); }
    return this.ctx;
  },
  tone: function (freq, dur, type, vol, slideTo, delay) {
    var c = this.ac();
    if (!c) { return; }
    var t = c.currentTime + (delay || 0);
    var o = c.createOscillator();
    var g = c.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, t);
    if (slideTo) { o.frequency.exponentialRampToValueAtTime(slideTo, t + dur); }
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol || 0.18, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g);
    g.connect(c.destination);
    o.start(t);
    o.stop(t + dur + 0.04);
  },
  noise: function (dur, freq, q, vol) {
    var c = this.ac();
    if (!c) { return; }
    var n = Math.floor(c.sampleRate * dur);
    var b = c.createBuffer(1, n, c.sampleRate);
    var d = b.getChannelData(0);
    for (var i = 0; i < n; i++) { d[i] = (Math.random() * 2 - 1) * (1 - i / n); }
    var s = c.createBufferSource();
    s.buffer = b;
    var f = c.createBiquadFilter();
    f.type = 'bandpass';
    f.frequency.value = freq;
    f.Q.value = q || 1;
    var g = c.createGain();
    g.gain.value = vol || 0.14;
    s.connect(f);
    f.connect(g);
    g.connect(c.destination);
    s.start();
  },
  pop: function () { this.tone(520, 0.1, 'sine', 0.2, 940); },
  yay: function () {
    var self = this;
    [523.25, 659.25, 783.99, 1046.5].forEach(function (f, i) {
      self.tone(f, 0.34, 'triangle', 0.15, null, i * 0.07);
    });
  },
  fizz: function () { this.noise(0.4, 3400, 0.5, 0.09); }
};

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { joined: false, burst: 0 };
  }
  play(name) {
    if (this.props.sound === false) { return; }
    try { SND[name](); } catch (e) { }
  }
  componentWillUnmount() { clearTimeout(this._t); }
  renderVals() {
    var self = this;
    var joined = this.state.joined;
    var chars = ['R', 'L', '4', 'K', joined ? '9' : '', ''];
    var cells = chars.map(function (ch, i) {
      var filled = ch !== '';
      var isCaret = !filled && i === (joined ? 5 : 4);
      return {
        ch: ch,
        hasChar: filled,
        isCaret: isCaret,
        bg: filled ? '#0B0B0C' : '#FFFFFF',
        edge: filled ? '#0B0B0C' : (isCaret ? '#4B3BFF' : '#E8E8E6'),
        ink: '#FFFFFF',
        pop: filled ? 'scale(1)' : 'scale(0.97)'
      };
    });
    var palette = ['#4B3BFF', '#FF4B3B', '#00C97A', '#FFC400', '#0B0B0C'];
    var bits = [];
    if (this.state.burst > 0) {
      for (var i = 0; i < 18; i++) {
        bits.push({
          left: (4 + i * 5.4) + '%',
          w: (6 + (i % 3) * 3) + 'px',
          h: (10 + (i % 4) * 4) + 'px',
          color: palette[i % palette.length],
          delay: (i % 6) * 70 + 'ms'
        });
      }
    }
    return {
      cells: cells,
      bits: bits,
      joined: joined,
      waiting: !joined,
      btnLabel: joined ? 'LET’S GO' : 'JOIN THE HUNT',
      btnBg: joined ? '#00C97A' : '#4B3BFF',
      btnShadow: joined ? '#00A063' : '#2E1FD6',
      btnGlow: joined ? 'rgba(0,201,122,0.34)' : 'rgba(75,59,255,0.34)',
      join: function () {
        if (self.state.joined) { self.play('pop'); return; }
        self.play('pop');
        setTimeout(function () { self.play('yay'); self.play('fizz'); }, 120);
        self.setState({ joined: true, burst: self.state.burst + 1 });
        clearTimeout(self._t);
        self._t = setTimeout(function () { self.setState({ joined: false, burst: 0 }); }, 7000);
      }
    };
  }
}
</script>
</body>
</html>

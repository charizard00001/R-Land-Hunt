<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Space+Grotesk:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap">
  <style>
    body { margin: 0; background: #F6F6F4; }
    a { color: #4B3BFF; }
    a:hover { color: #2E1FD6; }
    .push { transition: transform 110ms cubic-bezier(0.3, 1.4, 0.5, 1), box-shadow 110ms ease; }
    .push:active { transform: translateY(6px); box-shadow: 0 0 0 #00A063; }
    .ghost { transition: transform 110ms ease, background 140ms ease; }
    .ghost:active { transform: scale(0.97); background: #EFEFEC; }
    .confetti { position: absolute; top: -24px; border-radius: 2px; animation: fall 2100ms cubic-bezier(0.25, 0.6, 0.4, 1) forwards; }
    @keyframes fall {
      0% { transform: translateY(0) rotate(0deg); opacity: 1; }
      100% { transform: translateY(900px) rotate(680deg); opacity: 0; }
    }
    .stamp { animation: stamp 620ms cubic-bezier(0.2, 1.6, 0.35, 1) both; }
    @keyframes stamp {
      0% { transform: scale(0.3); opacity: 0; }
      55% { transform: scale(1.14); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }
    .halo { animation: halo 1400ms ease-out both; }
    @keyframes halo {
      0% { transform: scale(0.6); opacity: 0.55; }
      100% { transform: scale(2.5); opacity: 0; }
    }
    .riseA { animation: rise 560ms cubic-bezier(0.2, 1.3, 0.4, 1) 260ms both; }
    .riseB { animation: rise 560ms cubic-bezier(0.2, 1.3, 0.4, 1) 420ms both; }
    .riseC { animation: rise 620ms cubic-bezier(0.2, 1.3, 0.4, 1) 620ms both; }
    @keyframes rise {
      0% { transform: translateY(24px); opacity: 0; }
      100% { transform: translateY(0); opacity: 1; }
    }
  </style>
</helmet>

<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #FFFFFF; font-family: 'Space Grotesk', system-ui, sans-serif; color: #0B0B0C; display: flex; flex-direction: column; align-items: center;">

  <div style="position: absolute; left: 50%; top: 96px; width: 420px; height: 420px; margin-left: -210px; border-radius: 50%; background: #00C97A; opacity: 0.06; pointer-events: none;"></div>

  <sc-for list="{{ bits }}" as="b" hint-placeholder-count="22">
    <span class="confetti" style="left: {{ b.left }}; width: {{ b.w }}; height: {{ b.h }}; background: {{ b.color }}; animation-delay: {{ b.delay }};"></span>
  </sc-for>

  <div style="position: relative; margin-top: 62px; width: 104px; height: 104px;">
    <span class="halo" style="position: absolute; inset: 0; border-radius: 50%; background: #00C97A;"></span>
    <div class="stamp" style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; border-radius: 50%; background: #00C97A; box-shadow: 0 14px 30px rgba(0,201,122,0.4);">
      <svg viewBox="0 0 24 24" width="52" height="52" fill="none" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M5 13l5 5L19 7"></path>
      </svg>
    </div>
  </div>

  <div class="riseA" style="position: relative; display: flex; flex-direction: column; align-items: center; gap: 5px; margin-top: 22px;">
    <span style="font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.2em; color: #A0A0A8;">CLUE 03 CLEARED</span>
    <span style="font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-weight: 800; font-size: 38px; line-height: 1; letter-spacing: -0.04em;">Nailed it.</span>
  </div>

  <div class="riseB" style="position: relative; display: flex; align-items: baseline; gap: 6px; margin-top: 14px;">
    <span style="font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-weight: 800; font-size: 76px; line-height: 0.9; letter-spacing: -0.055em; color: #00C97A;">+{{ pts }}</span>
    <span style="font-family: 'Space Mono', monospace; font-size: 13px; color: #A0A0A8;">PTS</span>
  </div>

  <div class="riseB" style="position: relative; display: flex; gap: 7px; margin-top: 16px;">
    <span style="display: flex; align-items: center; gap: 6px; padding: 7px 13px 8px; border-radius: 999px; background: #FFF0EE;">
      <span style="width: 6px; height: 6px; border-radius: 50%; background: #FF4B3B;"></span>
      <span style="font-family: 'Space Mono', monospace; font-size: 10px; letter-spacing: 0.08em; color: #D62E1F;">FIRST BLOOD +40</span>
    </span>
    <span style="display: flex; align-items: center; gap: 6px; padding: 7px 13px 8px; border-radius: 999px; background: #F6F6F4;">
      <span style="width: 6px; height: 6px; border-radius: 50%; background: #A0A0A8;"></span>
      <span style="font-family: 'Space Mono', monospace; font-size: 10px; letter-spacing: 0.08em; color: #6B6B72;">NO HINTS</span>
    </span>
  </div>

  <div class="riseC" style="position: relative; width: 100%; padding: 0 24px; margin-top: 30px;">
    <div style="position: relative; padding: 22px 22px 24px; border-radius: 26px; background: #F6F6F4; border: 1.5px solid #EDEDEA;">
      <div style="display: inline-flex; align-items: center; gap: 7px; padding: 5px 11px 6px; border-radius: 999px; background: #4B3BFF; margin-bottom: 13px;">
        <span style="font-family: 'Space Mono', monospace; font-size: 10px; letter-spacing: 0.1em; color: #FFFFFF;">CLUE 04 UNLOCKED</span>
      </div>
      <div style="font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-weight: 600; font-size: 25px; line-height: 1.16; letter-spacing: -0.025em; color: #0B0B0C; text-wrap: pretty;">Follow the water that runs uphill at six. Where the crows hold court, look low.</div>
      <div style="display: flex; align-items: center; gap: 14px; margin-top: 18px; padding-top: 16px; border-top: 1.5px solid #EDEDEA;">
        <span style="font-family: 'Space Mono', monospace; font-size: 11px; color: #6B6B72;">310 M AWAY</span>
        <span style="width: 4px; height: 4px; border-radius: 50%; background: #C8C8CE;"></span>
        <span style="font-family: 'Space Mono', monospace; font-size: 11px; color: #6B6B72;">HEAD SOUTH-EAST</span>
      </div>
    </div>
  </div>

  <div style="position: relative; flex-grow: 1;"></div>

  <div style="position: relative; display: flex; flex-direction: column; gap: 11px; width: 100%; padding: 0 24px 28px;">
    <div class="ghost" onClick="{{ replay }}" style="display: flex; align-items: center; justify-content: center; gap: 9px; min-height: 52px; border-radius: 999px; background: #F6F6F4; border: 1.5px solid #E8E8E6; cursor: pointer;">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#6B6B72" stroke-width="2.4" stroke-linecap="round" aria-hidden="true">
        <path d="M20 12a8 8 0 1 1-2.6-5.9"></path>
        <path d="M20 4v5h-5"></path>
      </svg>
      <span style="font-size: 14px; font-weight: 500; color: #6B6B72;">Play that again</span>
    </div>
    <div class="push" onClick="{{ go }}" style="display: flex; align-items: center; justify-content: center; gap: 11px; min-height: 68px; border-radius: 999px; background: #00C97A; box-shadow: 0 6px 0 #00A063, 0 16px 30px rgba(0,201,122,0.34); cursor: pointer;">
      <span style="font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-weight: 800; font-size: 22px; letter-spacing: -0.02em; color: #FFFFFF;">CHASE IT</span>
      <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="#FFFFFF" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M5 12h13"></path>
        <path d="M12 6l6 6-6 6"></path>
      </svg>
    </div>
  </div>

</div>
</x-dc>

<script data-dc-script data-props='{"sound":{"editor":"boolean","default":true,"section":"Feel"},"$preview":{"width":390,"height":844}}'>
var SND = {
  ctx: null,
  ac: function () {
    if (!this.ctx) {
      var C = window.AudioContext || window.webkitAudioContext;
      if (!C) { return null; }
      this.ctx = new C();
    }
    if (this.ctx.state === 'suspended') { this.ctx.resume(); }
    return this.ctx;
  },
  tone: function (freq, dur, type, vol, slideTo, delay) {
    var c = this.ac();
    if (!c) { return; }
    var t = c.currentTime + (delay || 0);
    var o = c.createOscillator();
    var g = c.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, t);
    if (slideTo) { o.frequency.exponentialRampToValueAtTime(slideTo, t + dur); }
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol || 0.18, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g);
    g.connect(c.destination);
    o.start(t);
    o.stop(t + dur + 0.04);
  },
  noise: function (dur, freq, q, vol) {
    var c = this.ac();
    if (!c) { return; }
    var n = Math.floor(c.sampleRate * dur);
    var b = c.createBuffer(1, n, c.sampleRate);
    var d = b.getChannelData(0);
    for (var i = 0; i < n; i++) { d[i] = (Math.random() * 2 - 1) * (1 - i / n); }
    var s = c.createBufferSource();
    s.buffer = b;
    var f = c.createBiquadFilter();
    f.type = 'bandpass';
    f.frequency.value = freq;
    f.Q.value = q || 1;
    var g = c.createGain();
    g.gain.value = vol || 0.14;
    s.connect(f);
    f.connect(g);
    g.connect(c.destination);
    s.start();
  },
  thump: function () { this.tone(180, 0.14, 'sine', 0.26, 90); },
  fizz: function () { this.noise(0.45, 3600, 0.5, 0.1); },
  fanfare: function () {
    var self = this;
    [523.25, 659.25, 783.99, 1046.5, 1318.5].forEach(function (f, i) {
      self.tone(f, 0.42, 'triangle', 0.16, null, i * 0.075);
    });
  },
  blip: function () { this.tone(1240, 0.035, 'sine', 0.05); },
  pop: function () { this.tone(520, 0.1, 'sine', 0.2, 940); }
};

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { pts: 140, burst: 1 };
    this.timers = [];
  }
  play(name) {
    if (this.props.sound === false) { return; }
    try { SND[name](); } catch (e) { }
  }
  clear() {
    this.timers.forEach(function (t) { clearTimeout(t); clearInterval(t); });
    this.timers = [];
  }
  run() {
    var self = this;
    this.clear();
    this.setState({ pts: 0, burst: this.state.burst + 1 });
    this.play('thump');
    this.timers.push(setTimeout(function () { self.play('fanfare'); self.play('fizz'); }, 170));
    var n = 0;
    var iv = setInterval(function () {
      n += 7;
      if (n >= 140) { n = 140; clearInterval(iv); }
      self.setState({ pts: n });
      self.play('blip');
    }, 30);
    this.timers.push(iv);
  }
  componentDidMount() { this.run(); }
  componentWillUnmount() { this.clear(); }
  renderVals() {
    var self = this;
    var palette = ['#4B3BFF', '#FF4B3B', '#00C97A', '#FFC400', '#0B0B0C'];
    var bits = [];
    for (var i = 0; i < 22; i++) {
      bits.push({
        left: (2 + i * 4.4) + '%',
        w: (5 + (i % 3) * 3) + 'px',
        h: (9 + (i % 4) * 5) + 'px',
        color: palette[i % palette.length],
        delay: ((i * 53) % 620) + 'ms'
      });
    }
    return {
      bits: bits,
      pts: this.state.pts,
      replay: function () { self.run(); },
      go: function () { self.play('pop'); }
    };
  }
}
</script>
</body>
</html>

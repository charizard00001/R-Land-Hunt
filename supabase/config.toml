project_id = "rland-hunt"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[local_smtp]
enabled = true
port = 54324

[storage]
enabled = true

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://localhost:3000"]
jwt_expiry = 3600
enable_signup = true

# Players never make an account. They tap Join and get an anonymous session.
enable_anonymous_sign_ins = true

[auth.email]
enable_signup = true
# Organisers use email + password, so the app needs no SMTP at all.
enable_confirmations = false

[realtime]
enabled = true

[analytics]
enabled = false
